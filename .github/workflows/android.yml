name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test web application
        run: npm test && npm run check

      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check mobile UI and speech dispatch
        run: npm run test:ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: English_Recite-UI-checks
          path: output/ui/
          retention-days: 7
          if-no-files-found: ignore

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verify APK and Android TTS declaration
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/english-recite-manifest.xml
          grep -F "android.intent.action.TTS_SERVICE" /tmp/english-recite-manifest.xml
          python3 - <<'CHECK'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/english-recite-manifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          service = next(s for s in root.findall('.//service') if s.get(ns + 'name', '').endswith('.PlaybackService'))
          kind = service.get(ns + 'foregroundServiceType', '')
          assert kind == 'mediaPlayback' or int(kind, 0) == 2, kind
          assert service.get(ns + 'exported') == 'false'
          assert any(p.get(ns + 'name') == 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' for p in root.findall('uses-permission'))
          print('Media playback service and permission verified in compiled APK')
          CHECK
          unzip -l "$APK" > /tmp/english-recite-apk-files.txt
          grep -F "assets/www/audio-store.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/word-export.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/backup.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/archive.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/docx-import.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/file-download.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/assignment-player.js" /tmp/english-recite-apk-files.txt
          grep -F "assets/www/icons.js" /tmp/english-recite-apk-files.txt

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify locked-screen playback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.qilin.englishrecite.debug android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w com.qilin.englishrecite.debug.test/com.qilin.englishrecite.PlaybackInstrumentation | tee output/android-playback.txt
            adb logcat -d -s chromium AndroidRuntime EnglishRecite > output/android-playback-logcat.txt
            grep -F "Background playback checks passed" output/android-playback.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: English_Recite-Android-playback-checks
          path: output/android-playback*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare download file
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/English_Recite_v1.9.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: English_Recite-Android
          path: output/English_Recite_v1.9.0.apk
          if-no-files-found: error
          retention-days: 30
