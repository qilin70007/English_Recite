name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test web application
        run: npm test && npm run check

      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check mobile UI and speech dispatch
        run: npm run test:ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: English_Recite-UI-checks
          path: output/ui/
          retention-days: 7
          if-no-files-found: ignore

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and Android TTS declaration
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/english-recite-manifest.xml
          grep -F "android.intent.action.TTS_SERVICE" /tmp/english-recite-manifest.xml
          unzip -l "$APK" > /tmp/english-recite-apk-files.txt
          grep -F "assets/www/audio-store.js" /tmp/english-recite-apk-files.txt

      - name: Prepare download file
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/English_Recite_v1.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: English_Recite-Android
          path: output/English_Recite_v1.2.0.apk
          if-no-files-found: error
          retention-days: 30
